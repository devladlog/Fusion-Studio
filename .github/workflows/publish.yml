name: Publish Extension

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.4.3
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Bundle
        run: npm run bundle:prod

      # vsce runs "vscode:prepublish" (type-check + production bundle) again before packaging.
      - name: Package VSIX
        run: npx @vscode/vsce package

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath *.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: extension/*.vsix
          generate_release_notes: true
