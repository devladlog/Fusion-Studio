name: Azure DevOps Power Platform Pipeline

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/**

variables:
  - group: PowerPlatform-Credentials
  - name: solutionName
    value: 'PowerAppsSolution'
  - name: sourceFolder
    value: 'src'

stages:
  - stage: Validate
    displayName: 'Validate & Build'
    jobs:
      - job: ValidateJob
        displayName: 'Validate Canvas App'
        pool:
          vmImage: 'windows-latest'
        
        steps:
          - task: NodeTool@0
            displayName: 'Setup Node.js'
            inputs:
              versionSpec: '20.x'
          
          - task: Npm@1
            displayName: 'Install dependencies'
            inputs:
              command: 'ci'
              workingDir: 'extension'
          
          - task: Npm@1
            displayName: 'Run linting'
            inputs:
              command: 'custom'
              customCommand: 'run lint'
              workingDir: 'extension'
          
          - task: PowerPlatformToolInstaller@2
            displayName: 'Install Power Platform CLI'
            inputs:
              DefaultVersion: true
          
          - task: PowerShell@2
            displayName: 'Pack Canvas App'
            inputs:
              targetType: 'inline'
              script: |
                $sourcePath = "$(Build.SourcesDirectory)/$(sourceFolder)"
                $outputPath = "$(Build.ArtifactStagingDirectory)/$(solutionName).msapp"
                
                if (Test-Path $sourcePath) {
                    pac canvas pack --sources $sourcePath --msapp $outputPath
                    Write-Host "##vso[task.setvariable variable=msappPath]$outputPath"
                } else {
                    Write-Host "##vso[task.logissue type=warning]Source folder not found"
                }
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Canvas App artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'canvas-app'

  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    
    jobs:
      - deployment: DeployDevJob
        displayName: 'Deploy to Dev Environment'
        environment: 'Development'
        pool:
          vmImage: 'windows-latest'
        
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerPlatformToolInstaller@2
                  displayName: 'Install Power Platform CLI'
                
                - task: PowerPlatformSetConnectionVariables@2
                  displayName: 'Set connection variables'
                  inputs:
                    authenticationType: 'PowerPlatformSPN'
                    PowerPlatformSPN: 'DevEnvironment-ServiceConnection'
                
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Canvas App'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'canvas-app'
                    downloadPath: '$(Pipeline.Workspace)'
                
                - task: PowerShell@2
                  displayName: 'Deploy Canvas App'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "Deploying to Development environment..."
                      # Deployment logic here

  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    
    jobs:
      - deployment: DeployProdJob
        displayName: 'Deploy to Production Environment'
        environment: 'Production'
        pool:
          vmImage: 'windows-latest'
        
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerPlatformToolInstaller@2
                  displayName: 'Install Power Platform CLI'
                
                - task: PowerPlatformSetConnectionVariables@2
                  displayName: 'Set connection variables'
                  inputs:
                    authenticationType: 'PowerPlatformSPN'
                    PowerPlatformSPN: 'ProdEnvironment-ServiceConnection'
                
                - task: DownloadBuildArtifacts@1
                  displayName: 'Download Canvas App'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'canvas-app'
                    downloadPath: '$(Pipeline.Workspace)'
                
                - task: PowerShell@2
                  displayName: 'Deploy to Production'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "Deploying to Production environment..."
                      # Production deployment with approval gates
